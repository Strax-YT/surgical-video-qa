name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The suite runs against the stub backend, so CI needs neither torch,
      # a GPU, nor a Neo4j service container. Install only what the tests use.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings httpx \
                      opencv-python-headless numpy pytest ruff PyYAML

      - name: Lint
        run: ruff check src tests

      - name: Test
        env:
          SVQA_BACKEND: stub
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t surgical-video-qa:${{ github.sha }} .
