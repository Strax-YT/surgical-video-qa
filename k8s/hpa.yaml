apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: svqa-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: svqa-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleUp:
      # Each new pod pays a cold model load, so scale up in small steps
      # rather than doubling and stampeding the checkpoint storage.
      stabilizationWindowSeconds: 30
      policies:
        - { type: Pods, value: 2, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 120 }
